name: build-apk
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: |
          cp node_modules/pdfjs-dist/build/pdf.min.js www/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/
          npx cap add android
          mkdir -p android/app/src/main/java/com/manga/reader
          cp MainActivity.java android/app/src/main/java/com/manga/reader/MainActivity.java
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: manga-reader-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
